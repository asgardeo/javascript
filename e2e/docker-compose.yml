services:
  # ============================================================================
  # WSO2 Identity Server
  # ============================================================================
  wso2is:
    image: wso2/wso2is:latest
    container_name: asgardeo-e2e-wso2is
    ports:
      - "9443:9443"
      - "9763:9763"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:9443/carbon/admin/login.jsp"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge
